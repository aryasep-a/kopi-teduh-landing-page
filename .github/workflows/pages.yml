name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - name: Build public portfolio site
        run: npm run build
        env:
          PUBLIC_ALLOW_INDEXING: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  audit:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lighthouse mobile audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://aryasep-a.github.io/kopi-teduh-landing-page/
          runs: 1
          uploadArtifacts: true
          temporaryPublicStorage: true

  screenshots:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Capture portfolio breakpoints
        run: |
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size "390,844" --full-page --wait-for-timeout 1500 https://aryasep-a.github.io/kopi-teduh-landing-page/ docs/screenshots/mobile.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size "1440,900" --full-page --wait-for-timeout 1500 https://aryasep-a.github.io/kopi-teduh-landing-page/ docs/screenshots/desktop.png
      - name: Commit screenshots
        run: |
          git add docs/screenshots/mobile.png docs/screenshots/desktop.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: add desktop and mobile portfolio screenshots"
            git push
          fi
